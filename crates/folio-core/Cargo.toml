[package]
name = "folio-core"
description = "Folio core library: audio capture, transcription, vault writes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["lib"]
name = "folio_core"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
cpal = { workspace = true }
hound = { workspace = true }
rubato = { workspace = true }
voice_activity_detector = { workspace = true }
sherpa-onnx = { workspace = true }

# RNNoise system-audio speech enhancement (GET-188). Pure-Rust, always
# compiled (the runtime `system_audio_enhancement.enabled` setting is the
# user-facing toggle). See `audio::enhancement`.
nnnoiseless = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
toml = { workspace = true }
ts-rs = { workspace = true }
aes-gcm = { workspace = true }
argon2 = { workspace = true }
uuid = { workspace = true }

# Memory layer.
rusqlite = { workspace = true }
sqlite-vec = { workspace = true }
zerocopy = { workspace = true }
zstd = { workspace = true }

# Zip writer for the vault snapshot export.
zip = { workspace = true }

# HMAC-SHA256 for the webhook signed event stream (v2 finding 079 /
# GET-101).
sha2 = { workspace = true }
hex = { workspace = true }

# HTTP client for the OpenAI Whisper transcription backend, the
# local-model downloader, and the LLM provider chat calls. Only the
# rustls TLS stack is enabled; openssl is denied by deny.toml.
reqwest = { workspace = true }

# LLM provider plumbing for the AI chat feature (phase 1 of the plan
keyring = { workspace = true }
async-trait = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# ScreenCaptureKit Rust bindings for system audio capture.
# Pinned to a known-good version. Migration path to CoreAudio HAL Tap
# (macOS 14.4+, no Screen Recording permission required) tracked in
# architecture/audio-capture.md.
screencapturekit = "0.3"
core-media-rs = "0.3"
core-audio-types-rs = "0.3"

# libc — used for pthread_set_qos_class_self_np in the QoS module
# (v2 finding 064 / GET-99). Audio callbacks tag themselves
# USER_INTERACTIVE; whisper threads tag themselves USER_INITIATED so
# the scheduler keeps capture on the P-cores while batch transcoding
# can land on the E-cores when system load allows.
libc = { workspace = true }

# Apple Voice Processing IO AudioUnit for the AEC + NS + AGC mic
coreaudio-rs = { workspace = true }
coreaudio-sys = { workspace = true }

# objc2-core-audio: safe Rust bindings for AudioHardwareCreateProcessTap
# (macOS 14.4+). Used by the process-tap system-audio backend (GET-170)
# that replaces SCK and avoids the Screen Recording permission.
objc2-core-audio = { version = "0.3", features = [
  "AudioHardware",
  "objc2",
  "objc2-foundation",
] }

# Local Whisper inference. Metal acceleration on Apple Silicon gives
# us ~5-10x realtime on M1+ for the large-v3 model. The first build
# compiles whisper.cpp from source (~5 min on a cold machine).
whisper-rs = { workspace = true, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Non-macOS targets get whisper-rs without Metal (CPU only). The app
# is macOS-first for v0, but the workspace still builds elsewhere so
# `cargo check --workspace` works on Linux CI runners for cargo-deny.
whisper-rs = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3.10"
filetime = "0.2"
