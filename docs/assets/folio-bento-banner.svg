    <rect x="50" y="332" width="214" height="58" rx="20" fill="#0E0E10" stroke="#303034"/>
    <text x="72" y="368" class="mono" font-size="20">2026-06-06.md</text>
    <use href="#icon-file" x="276" y="322" width="78" height="78" class="iconMuted"/>
  </g>

