<svg width="1600" height="800" viewBox="0 0 1600 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18181B"/>
      <stop offset="0.58" stop-color="#111114"/>
      <stop offset="1" stop-color="#0A0A0B"/>
    </linearGradient>
    <linearGradient id="cardDark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1D1D20"/>
      <stop offset="1" stop-color="#111114"/>
    </linearGradient>
    <linearGradient id="cardSoft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#242428"/>
      <stop offset="1" stop-color="#151518"/>
    </linearGradient>
    <linearGradient id="cardLight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F4F4F5"/>
      <stop offset="1" stop-color="#D4D4D8"/>
    </linearGradient>
    <linearGradient id="lineMuted" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F4F4F5"/>
      <stop offset="1" stop-color="#A1A1AA"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0.34 0.18) rotate(58) scale(0.74 0.84)">
      <stop stop-color="#F0F0F0"/>
      <stop offset="0.3" stop-color="#B0B0B8"/>
      <stop offset="0.66" stop-color="#4A4A52"/>
      <stop offset="1" stop-color="#18181B"/>
    </radialGradient>
    <linearGradient id="orbWave" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F4F4F5"/>
      <stop offset="0.5" stop-color="#EBEBEB"/>
      <stop offset="1" stop-color="#D4D4D8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-15%" width="120%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="1" stdDeviation="0" flood-color="#FFFFFF" flood-opacity="0.05"/>
    </filter>
    <filter id="orbShadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.46"/>
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#303034" flood-opacity="0.2"/>
    </filter>
    <clipPath id="orbClip">
      <circle cx="0" cy="0" r="1"/>
    </clipPath>

    <symbol id="icon-lock" viewBox="0 0 96 96">
      <path d="M28 42V31C28 19 36 11 48 11C60 11 68 19 68 31V42" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
      <rect x="22" y="39" width="56" height="44" rx="17" fill="currentColor"/>
    </symbol>
    <symbol id="icon-wave" viewBox="0 0 120 96">
      <path d="M10 50C28 32 44 32 62 50C80 68 96 68 114 50" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
      <path d="M12 56C30 66 47 66 64 56C80 46 96 46 112 56" stroke="currentColor" stroke-width="7" stroke-linecap="round" opacity="0.42"/>
    </symbol>
    <symbol id="icon-chip" viewBox="0 0 96 96">
      <rect x="22" y="22" width="52" height="52" rx="15" fill="none" stroke="currentColor" stroke-width="8"/>
      <rect x="35" y="35" width="26" height="26" rx="7" fill="currentColor"/>
      <path d="M10 34H20M10 48H20M10 62H20M76 34H86M76 48H86M76 62H86M34 10V20M48 10V20M62 10V20M34 76V86M48 76V86M62 76V86" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-calendar" viewBox="0 0 96 96">
      <rect x="17" y="22" width="62" height="58" rx="16" fill="currentColor"/>
      <rect x="17" y="22" width="62" height="18" rx="12" fill="#D4D4D8"/>
      <rect x="29" y="49" width="12" height="12" rx="4" fill="#71717A"/>
      <rect x="48" y="49" width="12" height="12" rx="4" fill="#71717A"/>
      <rect x="67" y="49" width="12" height="12" rx="4" fill="#A1A1AA"/>
      <rect x="32" y="67" width="34" height="7" rx="3.5" fill="#18181B"/>
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 96 96">
      <path d="M48 11L76 23V46C76 63 65 76 48 86C31 76 20 63 20 46V23L48 11Z" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/>
      <path d="M36 38L60 62M60 38L36 62" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-file" viewBox="0 0 96 96">
      <path d="M24 13H56L76 33V78C76 83 72 87 67 87H24C19 87 15 83 15 78V22C15 17 19 13 24 13Z" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/>
      <path d="M56 14V31C56 35 59 38 63 38H75" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/>
      <path d="M31 51H62M31 64H55" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-memory" viewBox="0 0 96 96">
      <circle cx="43" cy="43" r="27" fill="none" stroke="currentColor" stroke-width="8"/>
      <path d="M64 64L82 82" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>
      <path d="M27 44C37 34 45 34 55 44C60 49 64 50 69 47" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-chat" viewBox="0 0 96 96">
      <path d="M27 24H66C78 24 86 32 86 44C86 56 78 64 66 64H45L27 80V64H26C14 64 6 56 6 44C6 32 14 24 27 24Z" fill="currentColor"/>
      <path d="M28 44H66" stroke="#18181B" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    </symbol>
    <symbol id="icon-kanban" viewBox="0 0 120 96">
      <rect x="8" y="22" width="30" height="54" rx="12" fill="currentColor" opacity="0.22"/>
      <rect x="45" y="22" width="30" height="54" rx="12" fill="currentColor" opacity="0.38"/>
      <rect x="82" y="22" width="30" height="54" rx="12" fill="currentColor"/>
      <path d="M17 39H29M54 39H66M91 39H103" stroke="#18181B" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
    </symbol>
    <symbol id="icon-agent" viewBox="0 0 96 96">
      <path d="M48 12L58 37L84 48L58 59L48 84L37 59L12 48L37 37L48 12Z" fill="currentColor"/>
      <circle cx="48" cy="48" r="13" fill="#18181B"/>
    </symbol>
    <symbol id="icon-menubar" viewBox="0 0 120 96">
      <rect x="10" y="31" width="100" height="34" rx="17" fill="currentColor"/>
      <circle cx="33" cy="48" r="9" fill="#18181B"/>
      <rect x="51" y="44" width="39" height="8" rx="4" fill="#71717A"/>
    </symbol>
    <symbol id="icon-git" viewBox="0 0 96 96">
      <circle cx="28" cy="24" r="10" fill="none" stroke="currentColor" stroke-width="7"/>
      <circle cx="70" cy="48" r="10" fill="none" stroke="currentColor" stroke-width="7"/>
      <circle cx="28" cy="76" r="10" fill="none" stroke="currentColor" stroke-width="7"/>
      <path d="M28 34V66M38 24C54 24 59 48 60 48" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
    </symbol>
    <symbol id="folio-orb" viewBox="-1 -1 2 2">
      <circle cx="0" cy="0" r="1" fill="url(#orb)"/>
      <g clip-path="url(#orbClip)">
        <path d="M-1.06 0.02C-0.66 -0.25 -0.36 -0.25 0 0.02C0.39 0.32 0.73 0.32 1.1 0.02" stroke="url(#orbWave)" stroke-width="0.2" stroke-linecap="round"/>
        <path d="M-0.72 0.34C-0.42 0.78 0.28 0.9 0.74 0.54" stroke="#0E0E10" stroke-width="0.16" stroke-linecap="round" opacity="0.18"/>
      </g>
    </symbol>

    <style>
      .darkCard { fill: url(#cardDark); stroke: #303034; stroke-width: 1.5; }
      .softCard { fill: url(#cardSoft); stroke: #333338; stroke-width: 1.5; }
      .lightCard { fill: url(#cardLight); }
      .title { fill: #F4F4F5; font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif; font-weight: 740; letter-spacing: 0; }
      .label { fill: #D4D4D8; font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; font-weight: 720; letter-spacing: 0; }
      .muted { fill: #A1A1AA; font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; font-weight: 600; letter-spacing: 0; }
      .mono { fill: #E4E4E7; font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-weight: 650; letter-spacing: 0; }
      .wordmark { fill: #F4F4F5; font-family: Georgia, "Times New Roman", serif; font-weight: 400; letter-spacing: -2px; }
      .iconLight { color: #E4E4E7; }
      .iconMuted { color: #A1A1AA; }
      .iconDark { color: #18181B; }
    </style>
