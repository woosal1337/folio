    <text x="50" y="702" class="label" font-size="32">Ask Folio</text>
    <text x="50" y="737" class="muted" font-size="21">cited answers</text>
    <use href="#icon-chat" x="238" y="694" width="76" height="76" class="iconLight"/>
  </g>

  <g filter="url(#cardShadow)">
