    <rect x="592" y="284" width="448" height="54" rx="18" fill="#0E0E10" stroke="#303034"/>
    <text x="614" y="319" class="muted" font-size="19">Weekly product sync</text>
    <rect x="592" y="360" width="448" height="152" rx="22" fill="#111114" stroke="#303034"/>
    <text x="620" y="407" class="label" font-size="24">Transcript ready</text>
