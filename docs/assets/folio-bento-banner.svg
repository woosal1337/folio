    <text x="50" y="536" fill="#3F3F46" font-family="Inter, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="690" font-size="22">memory</text>
    <use href="#icon-memory" x="220" y="548" width="74" height="74" class="iconDark"/>
  </g>

