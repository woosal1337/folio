# Pre-commit hooks for Attune.
#
# One-time setup:
#   brew install pre-commit gitleaks shellcheck     (or your package manager)
#   pnpm install
#   pre-commit install
#   pre-commit install --hook-type commit-msg
#   pre-commit install --hook-type pre-push
#
# Run everything on the whole tree:
#   pre-commit run --all-files
#
# CI mirrors this configuration.

default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
fail_fast: false
minimum_pre_commit_version: "3.7.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(.*\.md|.*\.svg|src-tauri/icons/.*|.*\.lock|pnpm-lock\.yaml)$
      - id: end-of-file-fixer
        exclude: ^(src-tauri/icons/.*|.*\.lock|pnpm-lock\.yaml)$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
        exclude: ^(src-tauri/tauri\.conf\.json|src-tauri/capabilities/.*\.json|tsconfig.*\.json)$
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^(src-tauri/icons/.*|.*\.lock|pnpm-lock\.yaml)$
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      - id: forbid-submodules
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]

  - repo: https://github.com/crate-ci/typos
    rev: v1.27.3
    hooks:
      - id: typos
        exclude: ^(.*\.lock|pnpm-lock\.yaml|src-tauri/icons/.*|src-tauri/gen/.*|dist/.*)$

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      - id: taplo-lint

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.4
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-deny
        name: cargo deny check
        entry: cargo deny --all-features check
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(Cargo\.toml|Cargo\.lock|deny\.toml|crates/.*/Cargo\.toml|src-tauri/Cargo\.toml)$

      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [ts, tsx, javascript, jsx, json, css, html, markdown, yaml]
        exclude: ^(pnpm-lock\.yaml|src-tauri/gen/.*|dist/.*|CHANGELOG\.md|src/shared/types/.*)$

      - id: eslint
        name: eslint
        entry: pnpm exec eslint --max-warnings 0 --fix
        language: system
        types_or: [ts, tsx]
        exclude: ^(dist/.*|src-tauri/.*|src/shared/types/.*)$

      - id: tsc
        name: tsc --noEmit
        entry: pnpm exec tsc --noEmit
        language: system
        types: [ts]
        pass_filenames: false
        stages: [pre-push]
