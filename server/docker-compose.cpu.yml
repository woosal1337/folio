services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      FOLIO_DATABASE_URL: sqlite+aiosqlite:////data/folio.db
      FOLIO_STORAGE_DIR: /data/blobs
    ports:
      - "8080:8080"
    volumes:
      - folio-data:/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker.cpu
    env_file: .env
    environment:
      FOLIO_DATABASE_URL: sqlite+aiosqlite:////data/folio.db
      FOLIO_STORAGE_DIR: /data/blobs
      FOLIO_WHISPER_DEVICE: cpu
      FOLIO_WHISPER_COMPUTE_TYPE: int8
    volumes:
      - folio-data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  folio-data:
