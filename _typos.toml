# Configuration for typos (https://github.com/crate-ci/typos).

[default]
extend-ignore-identifiers-re = [
  "folio",
  "Folio",
  "FOLIO",
  "Spectral",
  "JetBrains",
  "rustfmt",
  "clippy",
  "Tauri",
  "Tailwind",
  "shadcn",
]

[default.extend-words]
# `abl` is the local variable name for an AudioBufferList in the
# ScreenCaptureKit callback (system.rs); it mirrors the API's
# abbreviation and is not a typo of "able".
abl = "abl"
# `ege` is the maintainer's name in the LICENSE.
ege = "ege"
# `MIS` is a proper-noun acronym in the Whisper glossary
# (Management Information Systems), not a misspelling of MISS/MIST.
MIS = "MIS"
# `qery` is a required four-character AppleScript OSType code in the
# `.sdef`, not a misspelling of "query".
qery = "qery"
# `Sizin` is Turkish ("your") inside a transcription test fixture.
Sizin = "Sizin"

[files]
extend-exclude = [
  "pnpm-lock.yaml",
  "Cargo.lock",
  "bun.lock",
  "dist/**",
  "target/**",
  "node_modules/**",
  "src-tauri/gen/**",
  "src-tauri/icons/**",
  "*.svg",
  # Localised permission strings — foreign-language words trip the
  # English spell-checker (e.g. Dutch "legt", German "deines").
  "src-tauri/locale/**",
  # ElevenLabs voice IDs are opaque strings (e.g. "...vdvUeBnXmlld").
  "scripts/generate-voice-fixtures.mjs",
]
