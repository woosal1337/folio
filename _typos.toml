# Configuration for typos (https://github.com/crate-ci/typos).

[default]
extend-ignore-identifiers-re = [
  "attune",
  "Attune",
  "ATTUNE",
  "Spectral",
  "JetBrains",
  "rustfmt",
  "clippy",
  "Tauri",
  "Tailwind",
  "shadcn",
]

[files]
extend-exclude = [
  "pnpm-lock.yaml",
  "Cargo.lock",
  "bun.lock",
  "dist/**",
  "target/**",
  "node_modules/**",
  "src-tauri/gen/**",
  "src-tauri/icons/**",
  "*.svg",
]
